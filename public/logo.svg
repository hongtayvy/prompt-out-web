<svg width="760" height="200" viewBox="0 0 760 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">PromptOut logo</title>
  <desc id="desc">A tilted lime rounded square with >_ inside followed by the lowercase word promptout.</desc>
  <defs>
    <filter id="hardShadow" x="0" y="0" width="200%" height="200%">
      <feOffset dx="4" dy="4" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.0667 0 0 0 0 0.0941 0 0 0 0 0.0824 0 0 0 1 0"/>
      <feBlend in="SourceGraphic" mode="normal"/>
    </filter>
  </defs>

  <!-- icon -->
  <g transform="translate(34 28)">
    <g transform="rotate(-7 56 56)" filter="url(#hardShadow)">
      <rect x="8" y="8" width="96" height="96" rx="18" fill="#C6F12A" stroke="#111815" stroke-width="3"/>
    </g>
    <text x="56" y="67" text-anchor="middle" fill="#111815"
      font-family="SFMono-Regular, SF Mono, ui-monospace, Menlo, Consolas, monospace"
      font-size="31" font-weight="700" letter-spacing="-1.2">&gt;_</text>
  </g>

  <!-- wordmark -->
  <g fill="#111815">
    <text x="165" y="118"
      font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif"
      font-size="72" font-weight="800" letter-spacing="-2.8">promptout</text>
  </g>
</svg>
