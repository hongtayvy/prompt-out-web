<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">PromptOut favicon</title>
  <desc id="desc">PromptOut favicon using the tilted lime >_ mark.</desc>
  <g transform="translate(4 4)">
    <g transform="rotate(-7 28 28)">
      <rect x="4" y="4" width="48" height="48" rx="10" fill="#C6F12A" stroke="#111815" stroke-width="2.4"/>
    </g>
    <text x="28" y="34" text-anchor="middle" fill="#111815"
      font-family="SFMono-Regular, SF Mono, ui-monospace, Menlo, Consolas, monospace"
      font-size="15" font-weight="700" letter-spacing="-0.7">&gt;_</text>
  </g>
</svg>
